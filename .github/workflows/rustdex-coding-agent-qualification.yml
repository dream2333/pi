            ${{ runner.temp }}/rebuild-attestation-verification.json
            ${{ steps.attest-release.outputs.bundle-path }}
            ${{ steps.attest-receipt.outputs.bundle-path }}
            ${{ runner.temp }}/release-evidence
            ${{ runner.temp }}/build-evidence
