name: Rustdex coding-agent qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustdex-coding-agent-v0.84.3.4-qualification-v4
  cancel-in-progress: false

env:
  FORK_REPOSITORY: https://github.com/dream2333/pi.git
  FORK_COMMIT: 4b7c269c1b650cf5ced56e05e6ac2998234a6542
  UPSTREAM_BASE_COMMIT: 4e494929998d6bc4fccf75e0a233f727db4b70ee
  THIN_FORK_PATCH_SHA256: af78710590d377a82ea755f4a7fbd1b56f51b5d3cc03888d5f84cdfa64dfcd87
  THIN_FORK_PATCH_BYTES: "41818"
  TRACE_TEST_SHA256: 2de7ade62736964a6239380a3f606ea3285062694e9fb0f14eab41f01a61a094
  RESPONSE_MODEL_TEST_SHA256: c5daf7dc3c7a1d3ab3c7926a171f61a514a845fe54d4ff2067c6c227e939c464
  RELEASE_TAG: rustdex-coding-agent-v0.84.3.4
  RELEASE_TAG_OBJECT_SHA: 7e37e30596ce05715a4b6e12994650916ea28944
  RELEASE_ID: "380237860"
  RELEASE_ASSET_ID: "539058861"
  RELEASE_FILE: dream2333-pi-coding-agent-0.84.3-rustdex.4.tgz
  RELEASE_SHA256: bfcde6d43844f7c351a892178a912a0c98578d4c7c5a33f548cf207d61537133
  RELEASE_SHA512: 5897e6a62e811e5a5ba2d022cf3c2c563f7cce182a9ab9f010c768de0494520db731e36259e2ee29ba1e1cbcfb0992525d4223ca1db48f2bc0302a011258ff73
  RELEASE_BYTES: "6892509"
  PACKAGE_NAME: "@dream2333/pi-coding-agent"
  PACKAGE_VERSION: 0.84.3-rustdex.4
  PACKAGE_JSON_SHA256: dfde78daed82ba030d66b2df8d83eb0e946cdb6bd554252caedcf8ba4b9e13b2
  PACKAGE_SHRINKWRAP_SHA256: ea2371235224837de22afb3659bb65bdcb7f6fa4a8edeacfcb678a52abecd212
  PACKAGE_CONTENTS_SHA256: 774af9bc6666562f3ee1af3f3c5c4884cb49225e2242ded80811cf1cb77a1480
  PACKAGE_ENTRY_COUNT: "1045"
  RELEASE_CONFIG_SHA256: 3a5af2cdd5dbff851a3d56ca1bffc70bc52de9df3752df3cc575a683a1ae6676
  LICENSE_SHA256: 0457f5bcec3b3b211605dfb5d1a49042fd638f3686a410fe099c24a25af13c48
  CONSUMER_DEPENDENCY_CLOSURE_SHA256: b62799f035d9bd43c35a05c9073e182bb62117a34aa277b2c538d2809474f0eb
  RUSTDEX_NODE_VERSION: 24.20.0
  RUSTDEX_NODE_VERSION_OUTPUT: v24.20.0
  RUSTDEX_NPM_VERSION: 11.9.0
  RUSTDEX_NPM_TARBALL_URL: https://registry.npmjs.org/npm/-/npm-11.9.0.tgz
  RUSTDEX_NPM_TARBALL_INTEGRITY: sha512-BBZoU926FCypj4b7V7ElinxsWcy4Kss88UG3ejFYmKyq7Uc5XnT34Me2nEhgCOaL5qY4HvGu5aI92C4OYd7NaA==
  RUSTDEX_NPM_TARBALL_SHA512: 04166853ddba142ca98f86fb57b1258a7c6c59ccb82acb3cf141b77a315898acaaed47395e74f7e0c7b69c486008e68be6a6381ef1aee5a23dd82e0e61decd68
  RUSTDEX_NPM_TARBALL_BYTES: "2413625"
  RUSTDEX_NPM_CLI_SHA256: 8e5f6f3429f8cdbe693cdc29904e9d5a7b127a494bd15c804bd54c7403bfcbe7
  UPSTREAM_MODEL_ARCHIVE_URL: https://github.com/earendil-works/pi/releases/download/v0.84.3/pi-0.84.3-source.tar.gz
  UPSTREAM_MODEL_ARCHIVE_SHA256: 056f84c467450fb5700ad4df9c8cc669bf7f6046976eed7a19eadbc7553b6500

jobs:
  build:
    name: build-${{ matrix.variant }}
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: fork-a
            sourceCommit: 4b7c269c1b650cf5ced56e05e6ac2998234a6542
            buildRelease: "true"
            runForkTests: "true"
          - variant: fork-b
            sourceCommit: 4b7c269c1b650cf5ced56e05e6ac2998234a6542
            buildRelease: "true"
            runForkTests: "false"
          - variant: upstream
            sourceCommit: 4e494929998d6bc4fccf75e0a233f727db4b70ee
            buildRelease: "false"
            runForkTests: "false"
    env:
      BUILD_VARIANT: ${{ matrix.variant }}
      SOURCE_COMMIT: ${{ matrix.sourceCommit }}
      BUILD_RELEASE: ${{ matrix.buildRelease }}
      RUN_FORK_TESTS: ${{ matrix.runForkTests }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Require exact current main workflow identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha' | tr -d '\r\n')"
          test "$GITHUB_SHA" = "$remote_main"
          runner_temp_posix="$(cygpath -u "$RUNNER_TEMP")"
          workspace_posix="$(cygpath -u "$GITHUB_WORKSPACE")"
          github_env_posix="$(cygpath -u "$GITHUB_ENV")"
          {
            echo "RUSTDEX_RUNNER_TEMP=$runner_temp_posix"
            echo "RUSTDEX_WORKSPACE=$workspace_posix"
            echo "RUSTDEX_MAIN_HEAD_AT_BUILD_START=$remote_main"
          } >> "$github_env_posix"

      - name: Fetch exact source and ancestry
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$FORK_REPOSITORY"
          git fetch --no-tags --depth=32 origin "$FORK_COMMIT"
          git merge-base --is-ancestor "$UPSTREAM_BASE_COMMIT" "$FORK_COMMIT"
          test "$(git merge-base "$UPSTREAM_BASE_COMMIT" "$FORK_COMMIT")" = "$UPSTREAM_BASE_COMMIT"
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.RUSTDEX_NODE_VERSION }}

      - name: Install and verify exact npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "$RUSTDEX_NODE_VERSION_OUTPUT"
          npm_tarball="$RUSTDEX_RUNNER_TEMP/npm-$RUSTDEX_NPM_VERSION.tgz"
          curl --fail --location --retry 3 --output "$npm_tarball" "$RUSTDEX_NPM_TARBALL_URL"
          test "$(wc -c < "$npm_tarball")" = "$RUSTDEX_NPM_TARBALL_BYTES"
          echo "$RUSTDEX_NPM_TARBALL_SHA512  $npm_tarball" | sha512sum --check --strict
          actual_integrity="$(node --input-type=commonjs -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`)' "$npm_tarball")"
          test "$actual_integrity" = "$RUSTDEX_NPM_TARBALL_INTEGRITY"
          npm_prefix="$RUSTDEX_RUNNER_TEMP/npm-toolchain-$RUSTDEX_NPM_VERSION"
          npm install --global --prefix "$npm_prefix" --ignore-scripts --no-audit --no-fund "$npm_tarball"
          npm_bin="$npm_prefix"
          npm_cli_posix="$npm_prefix/node_modules/npm/bin/npm-cli.js"
          npm_cli_native="$(cygpath -w "$npm_cli_posix")"
          test -f "$npm_cli_posix"
          echo "$RUSTDEX_NPM_CLI_SHA256  $npm_cli_posix" | sha256sum --check --strict
          test "$(node "$npm_cli_native" --version)" = "$RUSTDEX_NPM_VERSION"
          export PATH="$npm_bin:$PATH"
          export npm_execpath="$npm_cli_native"
          github_path_posix="$(cygpath -u "$GITHUB_PATH")"
          github_env_posix="$(cygpath -u "$GITHUB_ENV")"
          cygpath -w "$npm_bin" >> "$github_path_posix"
          {
            echo "RUSTDEX_NPM_BIN=$npm_bin"
            echo "RUSTDEX_NPM_CLI_POSIX=$npm_cli_posix"
            echo "npm_execpath=$npm_cli_native"
          } >> "$github_env_posix"
          hash -r
          test "$(command -v npm)" = "$npm_bin/npm"
          test "$(command -v npx)" = "$npm_bin/npx"
          test "$(node --version)" = "$RUSTDEX_NODE_VERSION_OUTPUT"
          test "$(npm --version)" = "$RUSTDEX_NPM_VERSION"

      - name: Verify the complete thin-fork patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$UPSTREAM_BASE_COMMIT" "$FORK_COMMIT" > "$RUSTDEX_RUNNER_TEMP/fork-files.txt"
          cat > "$RUSTDEX_RUNNER_TEMP/expected-fork-files.txt" <<'EOF'
          packages/ai/src/api/openai-completions.ts
          packages/ai/src/types.ts
          packages/ai/test/openai-completions-response-model.test.ts
          packages/coding-agent/src/core/sdk.ts
          packages/coding-agent/src/index.ts
          packages/coding-agent/test/sdk-model-dispatch-interceptor.test.ts
          scripts/build-rustdex-coding-agent-release.mjs
          scripts/rustdex-coding-agent-release.json
          scripts/rustdex-coding-agent-release.test.mjs
          EOF
          diff -u "$RUSTDEX_RUNNER_TEMP/expected-fork-files.txt" "$RUSTDEX_RUNNER_TEMP/fork-files.txt"
          git diff --binary --full-index "$UPSTREAM_BASE_COMMIT" "$FORK_COMMIT" -- \
            packages/ai/src/api/openai-completions.ts \
            packages/ai/src/types.ts \
            packages/ai/test/openai-completions-response-model.test.ts \
            packages/coding-agent/src/core/sdk.ts \
            packages/coding-agent/src/index.ts \
            packages/coding-agent/test/sdk-model-dispatch-interceptor.test.ts \
            scripts/build-rustdex-coding-agent-release.mjs \
            scripts/rustdex-coding-agent-release.json \
            scripts/rustdex-coding-agent-release.test.mjs \
            > "$RUSTDEX_RUNNER_TEMP/thin-fork.patch"
          echo "$THIN_FORK_PATCH_SHA256  $RUSTDEX_RUNNER_TEMP/thin-fork.patch" | sha256sum --check --strict
          test "$(wc -c < "$RUSTDEX_RUNNER_TEMP/thin-fork.patch")" = "$THIN_FORK_PATCH_BYTES"

      - name: Install exact monorepo dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(command -v npm)" = "$RUSTDEX_NPM_BIN/npm"
          test "$(command -v npx)" = "$RUSTDEX_NPM_BIN/npx"
          test "$(node --version)" = "$RUSTDEX_NODE_VERSION_OUTPUT"
          test "$(npm --version)" = "$RUSTDEX_NPM_VERSION"
          test -f "$RUSTDEX_NPM_CLI_POSIX"
          echo "$RUSTDEX_NPM_CLI_SHA256  $RUSTDEX_NPM_CLI_POSIX" | sha256sum --check --strict
          test "$(node "$npm_execpath" --version)" = "$RUSTDEX_NPM_VERSION"
          npm ci

      - name: Acquire and inspect pinned upstream model data
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUSTDEX_RUNNER_TEMP/pi-model-data.tar.gz" "$UPSTREAM_MODEL_ARCHIVE_URL"
          echo "$UPSTREAM_MODEL_ARCHIVE_SHA256  $RUSTDEX_RUNNER_TEMP/pi-model-data.tar.gz" | sha256sum --check --strict
          tar -tzf "$RUSTDEX_RUNNER_TEMP/pi-model-data.tar.gz" > "$RUSTDEX_RUNNER_TEMP/model-archive-members.txt"
          if grep -E '(^/|(^|/)\.\.(/|$))' "$RUSTDEX_RUNNER_TEMP/model-archive-members.txt"; then
            echo "unsafe model archive member" >&2
            exit 1
          fi
          if tar -tvzf "$RUSTDEX_RUNNER_TEMP/pi-model-data.tar.gz" | awk '{ type=substr($1,1,1); if (type != "-" && type != "d") exit 1 }'; then
            :
          else
            echo "model archive contains links or special entries" >&2
            exit 1
          fi
          if grep -Ev '^pi-0\.84\.3(/|$)' "$RUSTDEX_RUNNER_TEMP/model-archive-members.txt"; then
            echo "model archive root differs from the pinned release" >&2
            exit 1
          fi

      - name: Build exact source in an isolated runner
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUSTDEX_NPM_CLI_POSIX"
          echo "$RUSTDEX_NPM_CLI_SHA256  $RUSTDEX_NPM_CLI_POSIX" | sha256sum --check --strict
          test "$(node "$npm_execpath" --version)" = "$RUSTDEX_NPM_VERSION"
          if [[ "$BUILD_RELEASE" == "true" ]]; then
            mkdir -p "$RUSTDEX_RUNNER_TEMP/release"
            node scripts/build-rustdex-coding-agent-release.mjs \
              --output "$RUSTDEX_RUNNER_TEMP/release" \
              --model-data-archive "$RUSTDEX_RUNNER_TEMP/pi-model-data.tar.gz" \
              > "$RUSTDEX_RUNNER_TEMP/build.log" 2>&1
          else
            tar -xzf "$RUSTDEX_RUNNER_TEMP/pi-model-data.tar.gz" --strip-components=1 -C "$RUSTDEX_WORKSPACE"
            npm run build:offline > "$RUSTDEX_RUNNER_TEMP/build.log" 2>&1
          fi

      - name: Run upstream/fork no-interceptor trace
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA":.github/qualification/no-interceptor-trace.test.ts \
            > packages/coding-agent/test/rustdex-qualification-trace.test.ts
          echo "$TRACE_TEST_SHA256  packages/coding-agent/test/rustdex-qualification-trace.test.ts" | sha256sum --check --strict
          RUSTDEX_TRACE_OUTPUT="$RUNNER_TEMP/no-interceptor-trace.json" \
            npx vitest --run packages/coding-agent/test/rustdex-qualification-trace.test.ts \
            2>&1 | tee "$RUSTDEX_RUNNER_TEMP/trace-test.log"

      - name: Run dispatch and unchanged-state-machine conformance tests
        if: matrix.runForkTests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx vitest --run \
            packages/ai/test/openai-completions-response-model.test.ts \
            packages/coding-agent/test/sdk-model-dispatch-interceptor.test.ts \
            packages/coding-agent/test/agent-session-retry.test.ts \
            packages/coding-agent/test/agent-session-auto-compaction-queue.test.ts \
            packages/coding-agent/test/agent-session-concurrent.test.ts \
            packages/coding-agent/test/suite/regressions/1717-2113-agent-session-event-settlement.test.ts \
            packages/coding-agent/test/suite/regressions/3688-tree-cancel-compacting.test.ts \
            2>&1 | tee "$RUSTDEX_RUNNER_TEMP/fork-tests.log"
          node --test scripts/rustdex-coding-agent-release.test.mjs \
            2>&1 | tee "$RUSTDEX_RUNNER_TEMP/release-tests.log"

      - name: Verify release package identity
        if: matrix.buildRelease == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUSTDEX_RUNNER_TEMP/release/$RELEASE_FILE"
          test "$(wc -c < "$tarball")" = "$RELEASE_BYTES"
          echo "$RELEASE_SHA256  $tarball" | sha256sum --check --strict
          echo "$RELEASE_SHA512  $tarball" | sha512sum --check --strict
          mkdir -p "$RUSTDEX_RUNNER_TEMP/package"
          tar -tzf "$tarball" > "$RUSTDEX_RUNNER_TEMP/package-members.txt"
          if grep -E '(^/|(^|/)\.\.(/|$))' "$RUSTDEX_RUNNER_TEMP/package-members.txt"; then exit 1; fi
          if ! tar -tvzf "$tarball" | awk '{ type=substr($1,1,1); if (type != "-" && type != "d") exit 1 }'; then exit 1; fi
          if grep -Ev '^package(/|$)' "$RUSTDEX_RUNNER_TEMP/package-members.txt"; then exit 1; fi
          tar -xzf "$tarball" -C "$RUSTDEX_RUNNER_TEMP/package"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readdirSync, readFileSync, statSync, writeFileSync } from "node:fs";
          import { join, relative } from "node:path";
          const sha256 = (value) => createHash("sha256").update(value).digest("hex");
          const sha512 = (value) => createHash("sha512").update(value).digest("hex");
          const root = join(process.env.RUNNER_TEMP, "package", "package");
          const archivePath = join(process.env.RUNNER_TEMP, "release", process.env.RELEASE_FILE);
          const archiveBytes = readFileSync(archivePath);
          if (
            archiveBytes.length !== Number(process.env.RELEASE_BYTES)
            || sha256(archiveBytes) !== process.env.RELEASE_SHA256
            || sha512(archiveBytes) !== process.env.RELEASE_SHA512
          ) throw new Error("release archive identity drift");
          const packageBytes = readFileSync(join(root, "package.json"));
          const packageJson = JSON.parse(packageBytes);
          const required = {
            name: process.env.PACKAGE_NAME,
            version: process.env.PACKAGE_VERSION,
            main: "./dist/bundle/index.js",
            types: "./dist/index.d.ts",
          };
          for (const [key, expected] of Object.entries(required)) {
            if (packageJson[key] !== expected) throw new Error(`package ${key} drift`);
          }
          if (
            packageJson.exports?.["."]?.import !== "./dist/bundle/index.js"
            || packageJson.exports?.["."]?.types !== "./dist/index.d.ts"
            || packageJson.rustdexFork?.upstreamCommit !== process.env.UPSTREAM_BASE_COMMIT
            || packageJson.rustdexFork?.forkCommit !== process.env.FORK_COMMIT
            || packageJson.rustdexFork?.dispatchGuardAbi !== "model-dispatch-interceptor.v1"
            || packageJson.rustdexFork?.responseModelObservationAbi !== "openai-completions-response-model.v1"
            || packageJson.rustdexFork?.releaseConfigSha256 !== process.env.RELEASE_CONFIG_SHA256
          ) throw new Error("package runtime/fork identity drift");
          for (const name of ["preinstall", "install", "postinstall"]) {
            if (Object.hasOwn(packageJson.scripts ?? {}, name)) throw new Error(`forbidden lifecycle script: ${name}`);
          }
          const shrinkwrapHash = sha256(readFileSync(join(root, "npm-shrinkwrap.json")));
          const licenseHash = sha256(readFileSync(join(root, "LICENSE")));
          if (sha256(packageBytes) !== process.env.PACKAGE_JSON_SHA256) throw new Error("package.json drift");
          if (shrinkwrapHash !== process.env.PACKAGE_SHRINKWRAP_SHA256) throw new Error("shrinkwrap drift");
          if (licenseHash !== process.env.LICENSE_SHA256) throw new Error("license drift");
          const files = [];
          const visit = (directory) => {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              if (entry.isDirectory()) visit(path);
              else if (entry.isFile()) files.push(path);
              else throw new Error("unsupported package filesystem entry");
            }
          };
          visit(root);
          const records = files.map((path) => {
            const bytes = readFileSync(path);
            return `${relative(root, path).replaceAll("\\\\", "/")}\0${statSync(path).size}\0${sha256(bytes)}\n`;
          }).sort();
          const contentsHash = sha256(records.join(""));
          if (contentsHash !== process.env.PACKAGE_CONTENTS_SHA256) throw new Error("package contents drift");
          if (files.length !== Number(process.env.PACKAGE_ENTRY_COUNT)) throw new Error("package entry count drift");
          writeFileSync(join(process.env.RUNNER_TEMP, "package-identity.json"), `${JSON.stringify({
            schema: "rustdex.pi-package-identity.v2",
            packageName: packageJson.name,
            packageVersion: packageJson.version,
            archiveName: process.env.RELEASE_FILE,
            archiveBytes: archiveBytes.length,
            archiveSha256: sha256(archiveBytes),
            archiveSha512: sha512(archiveBytes),
            packageJsonSha256: sha256(packageBytes),
            shrinkwrapSha256: shrinkwrapHash,
            licenseSha256: licenseHash,
            packageContentsSha256: contentsHash,
            packageEntryCount: files.length,
            dispatchGuardAbi: packageJson.rustdexFork.dispatchGuardAbi,
            responseModelObservationAbi: packageJson.rustdexFork.responseModelObservationAbi,
            releaseConfigSha256: packageJson.rustdexFork.releaseConfigSha256,
            forbiddenLifecycleScripts: "absent",
          }, null, 2)}\n`);
          NODE

      - name: Run installed response-model consumer
        if: matrix.buildRelease == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUSTDEX_RUNNER_TEMP/release/$RELEASE_FILE"
          consumer_root="$(mktemp -d "$RUSTDEX_RUNNER_TEMP/rustdex-consumer-${BUILD_VARIANT}-XXXXXX")"
          git show "$GITHUB_SHA":.github/qualification/response-model-observation-consumer.test.mjs \
            > "$RUSTDEX_RUNNER_TEMP/response-model-observation-consumer.test.mjs"
          echo "$RESPONSE_MODEL_TEST_SHA256  $RUSTDEX_RUNNER_TEMP/response-model-observation-consumer.test.mjs" | sha256sum --check --strict
          cp "$RUSTDEX_RUNNER_TEMP/response-model-observation-consumer.test.mjs" "$consumer_root/response-model-observation-consumer.test.mjs"
          cd "$consumer_root"
          npm install --ignore-scripts --package-lock=false --no-audit --no-fund "$tarball" \
            2>&1 | tee "$RUSTDEX_RUNNER_TEMP/response-model-consumer-install.log"
          node --test response-model-observation-consumer.test.mjs \
            2>&1 | tee "$RUSTDEX_RUNNER_TEMP/response-model-consumer.log"

      - name: Assemble build evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "$RUSTDEX_NODE_VERSION_OUTPUT"
          test "$(npm --version)" = "$RUSTDEX_NPM_VERSION"
          test -f "$RUSTDEX_NPM_CLI_POSIX"
          echo "$RUSTDEX_NPM_CLI_SHA256  $RUSTDEX_NPM_CLI_POSIX" | sha256sum --check --strict
          test "$(node "$npm_execpath" --version)" = "$RUSTDEX_NPM_VERSION"
          evidence="$RUSTDEX_RUNNER_TEMP/evidence"
          mkdir -p "$evidence"
          cp "$RUSTDEX_RUNNER_TEMP/thin-fork.patch" "$evidence/thin-fork.patch"
          cp "$RUSTDEX_RUNNER_TEMP/no-interceptor-trace.json" "$evidence/no-interceptor-trace.json"
          cp "$RUSTDEX_RUNNER_TEMP/build.log" "$evidence/build.log"
          cp "$RUSTDEX_RUNNER_TEMP/trace-test.log" "$evidence/trace-test.log"
          if [[ -f "$RUSTDEX_RUNNER_TEMP/fork-tests.log" ]]; then cp "$RUSTDEX_RUNNER_TEMP/fork-tests.log" "$evidence/fork-tests.log"; fi
          if [[ -f "$RUSTDEX_RUNNER_TEMP/release-tests.log" ]]; then cp "$RUSTDEX_RUNNER_TEMP/release-tests.log" "$evidence/release-tests.log"; fi
          if [[ "$BUILD_RELEASE" == "true" ]]; then
            cp "$RUSTDEX_RUNNER_TEMP/release/$RELEASE_FILE" "$evidence/$RELEASE_FILE"
            cp "$RUSTDEX_RUNNER_TEMP/package-identity.json" "$evidence/package-identity.json"
            cp "$RUSTDEX_RUNNER_TEMP/response-model-observation-consumer.test.mjs" "$evidence/response-model-observation-consumer.test.mjs"
            cp "$RUSTDEX_RUNNER_TEMP/response-model-consumer-install.log" "$evidence/response-model-consumer-install.log"
            cp "$RUSTDEX_RUNNER_TEMP/response-model-consumer.log" "$evidence/response-model-consumer.log"
          fi
          export EVIDENCE_ROOT="$RUNNER_TEMP/evidence"
          export RUSTDEX_ACTUAL_NODE_VERSION="$(node --version)"
          export RUSTDEX_ACTUAL_NPM_VERSION="$(npm --version)"
          export PACKAGE_LOCK_SHA256="$(sha256sum package-lock.json | cut -d' ' -f1)"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { existsSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const hash = (name) => {
            const path = join(process.env.EVIDENCE_ROOT, name);
            return existsSync(path) ? createHash("sha256").update(readFileSync(path)).digest("hex") : null;
          };
          const metadata = {
            schema: "rustdex.pi-fork-build-evidence.v2",
            variant: process.env.BUILD_VARIANT,
            sourceCommit: process.env.SOURCE_COMMIT,
            workflowSourceCommit: process.env.GITHUB_SHA,
            workflowRef: process.env.GITHUB_REF,
            remoteMainAtStart: process.env.RUSTDEX_MAIN_HEAD_AT_BUILD_START,
            upstreamBaseCommit: process.env.UPSTREAM_BASE_COMMIT,
            forkCommit: process.env.FORK_COMMIT,
            runnerImage: `${process.env.ImageOS ?? "unknown"}-${process.env.ImageVersion ?? "unknown"}`,
            runnerOs: process.env.RUNNER_OS,
            runnerArch: process.env.RUNNER_ARCH,
            runnerEnvironment: process.env.RUNNER_ENVIRONMENT,
            nodeVersion: process.env.RUSTDEX_ACTUAL_NODE_VERSION,
            npmVersion: process.env.RUSTDEX_ACTUAL_NPM_VERSION,
            npmInstaller: {
              packageName: "npm",
              version: process.env.RUSTDEX_NPM_VERSION,
              tarballUrl: process.env.RUSTDEX_NPM_TARBALL_URL,
              integrity: process.env.RUSTDEX_NPM_TARBALL_INTEGRITY,
              sha512: process.env.RUSTDEX_NPM_TARBALL_SHA512,
              bytes: Number(process.env.RUSTDEX_NPM_TARBALL_BYTES),
              cliSha256: process.env.RUSTDEX_NPM_CLI_SHA256,
            },
            packageLockSha256: process.env.PACKAGE_LOCK_SHA256,
            patchSha256: hash("thin-fork.patch"),
            noInterceptorTraceSha256: hash("no-interceptor-trace.json"),
            buildLogSha256: hash("build.log"),
            traceTestLogSha256: hash("trace-test.log"),
            forkTestsLogSha256: hash("fork-tests.log"),
            releaseTestsLogSha256: hash("release-tests.log"),
            responseModelConsumerSourceSha256: hash("response-model-observation-consumer.test.mjs"),
            responseModelConsumerInstallLogSha256: hash("response-model-consumer-install.log"),
            responseModelConsumerLogSha256: hash("response-model-consumer.log"),
            releaseSha256: hash(process.env.RELEASE_FILE),
            packageIdentitySha256: hash("package-identity.json"),
            result: "PASS",
          };
          writeFileSync(join(process.env.EVIDENCE_ROOT, "build-evidence.json"), `${JSON.stringify(metadata, null, 2)}\n`);
          NODE

      - name: Upload isolated build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rustdex-qualification-${{ matrix.variant }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
  attest:
    name: compare-and-attest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Require exact current main workflow identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha' | tr -d '\r\n')"
          test "$GITHUB_SHA" = "$remote_main"
          echo "RUSTDEX_MAIN_HEAD_AT_ATTEST_START=$remote_main" >> "$GITHUB_ENV"

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.RUSTDEX_NODE_VERSION }}

      - name: Install and verify exact npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "$RUSTDEX_NODE_VERSION_OUTPUT"
          npm_tarball="$RUNNER_TEMP/npm-$RUSTDEX_NPM_VERSION.tgz"
          curl --fail --location --retry 3 --output "$npm_tarball" "$RUSTDEX_NPM_TARBALL_URL"
          test "$(wc -c < "$npm_tarball")" = "$RUSTDEX_NPM_TARBALL_BYTES"
          echo "$RUSTDEX_NPM_TARBALL_SHA512  $npm_tarball" | sha512sum --check --strict
          actual_integrity="$(node --input-type=commonjs -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`)' "$npm_tarball")"
          test "$actual_integrity" = "$RUSTDEX_NPM_TARBALL_INTEGRITY"
          npm_prefix="$RUNNER_TEMP/npm-toolchain-$RUSTDEX_NPM_VERSION"
          npm install --global --prefix "$npm_prefix" --ignore-scripts --no-audit --no-fund "$npm_tarball"
          npm_bin="$npm_prefix/bin"
          npm_cli="$npm_prefix/lib/node_modules/npm/bin/npm-cli.js"
          test -f "$npm_cli"
          echo "$RUSTDEX_NPM_CLI_SHA256  $npm_cli" | sha256sum --check --strict
          test "$(node "$npm_cli" --version)" = "$RUSTDEX_NPM_VERSION"
          export PATH="$npm_bin:$PATH"
          export npm_execpath="$npm_cli"
          echo "$npm_bin" >> "$GITHUB_PATH"
          {
            echo "RUSTDEX_NPM_BIN=$npm_bin"
            echo "RUSTDEX_NPM_CLI=$npm_cli"
            echo "npm_execpath=$npm_cli"
          } >> "$GITHUB_ENV"
          hash -r
          test "$(command -v npm)" = "$npm_bin/npm"
          test "$(node --version)" = "$RUSTDEX_NODE_VERSION_OUTPUT"
          test "$(npm --version)" = "$RUSTDEX_NPM_VERSION"

      - name: Download isolated build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: rustdex-qualification-*
          path: ${{ runner.temp }}/build-evidence

      - name: Compare clean builds and upstream trace
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/build-evidence"
          cmp "$root/rustdex-qualification-fork-a/$RELEASE_FILE" "$root/rustdex-qualification-fork-b/$RELEASE_FILE"
          cmp "$root/rustdex-qualification-fork-a/no-interceptor-trace.json" "$root/rustdex-qualification-fork-b/no-interceptor-trace.json"
          cmp "$root/rustdex-qualification-fork-a/no-interceptor-trace.json" "$root/rustdex-qualification-upstream/no-interceptor-trace.json"
          cmp "$root/rustdex-qualification-fork-a/thin-fork.patch" "$root/rustdex-qualification-fork-b/thin-fork.patch"
          cmp "$root/rustdex-qualification-fork-a/thin-fork.patch" "$root/rustdex-qualification-upstream/thin-fork.patch"
          cmp "$root/rustdex-qualification-fork-a/package-identity.json" "$root/rustdex-qualification-fork-b/package-identity.json"
          echo "$THIN_FORK_PATCH_SHA256  $root/rustdex-qualification-fork-a/thin-fork.patch" | sha256sum --check --strict
          echo "$RELEASE_SHA256  $root/rustdex-qualification-fork-a/$RELEASE_FILE" | sha256sum --check --strict
          echo "$RELEASE_SHA256  $root/rustdex-qualification-fork-b/$RELEASE_FILE" | sha256sum --check --strict

      - name: Verify immutable release and tag identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-evidence"
          gh api "repos/dream2333/pi/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-evidence/release.json"
          gh api "repos/dream2333/pi/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-evidence/tag-ref.json"
          tag_object="$(jq -r '.object.sha' "$RUNNER_TEMP/release-evidence/tag-ref.json")"
          test "$(jq -r '.object.type' "$RUNNER_TEMP/release-evidence/tag-ref.json")" = "tag"
          test "$tag_object" = "$RELEASE_TAG_OBJECT_SHA"
          gh api "repos/dream2333/pi/git/tags/$tag_object" > "$RUNNER_TEMP/release-evidence/tag-object.json"
          test "$(jq -r '.object.type' "$RUNNER_TEMP/release-evidence/tag-object.json")" = "commit"
          test "$(jq -r '.object.sha' "$RUNNER_TEMP/release-evidence/tag-object.json")" = "$FORK_COMMIT"
          test "$(jq -r '.immutable' "$RUNNER_TEMP/release-evidence/release.json")" = "true"
          test "$(jq -r '.draft' "$RUNNER_TEMP/release-evidence/release.json")" = "false"
          test "$(jq -r '.prerelease' "$RUNNER_TEMP/release-evidence/release.json")" = "false"
          test "$(jq -r '.tag_name' "$RUNNER_TEMP/release-evidence/release.json")" = "$RELEASE_TAG"
          test "$(jq -r '.id' "$RUNNER_TEMP/release-evidence/release.json")" = "$RELEASE_ID"
          test "$(jq '.assets | length' "$RUNNER_TEMP/release-evidence/release.json")" = "1"
          test "$(jq --arg name "$RELEASE_FILE" '[.assets[] | select(.name == $name)] | length' "$RUNNER_TEMP/release-evidence/release.json")" = "1"
          asset="$(jq -c --arg name "$RELEASE_FILE" '.assets[] | select(.name == $name)' "$RUNNER_TEMP/release-evidence/release.json")"
          test "$(jq -r '.id' <<<"$asset")" = "$RELEASE_ASSET_ID"
          test "$(jq -r '.size' <<<"$asset")" = "$RELEASE_BYTES"
          test "$(jq -r '.digest' <<<"$asset")" = "sha256:$RELEASE_SHA256"
          mkdir -p "$RUNNER_TEMP/release-evidence/published"
          gh release download "$RELEASE_TAG" --repo dream2333/pi --pattern "$RELEASE_FILE" --dir "$RUNNER_TEMP/release-evidence/published"
          echo "$RELEASE_SHA256  $RUNNER_TEMP/release-evidence/published/$RELEASE_FILE" | sha256sum --check --strict
          echo "$RELEASE_SHA512  $RUNNER_TEMP/release-evidence/published/$RELEASE_FILE" | sha512sum --check --strict
          cmp "$RUNNER_TEMP/build-evidence/rustdex-qualification-fork-a/$RELEASE_FILE" "$RUNNER_TEMP/release-evidence/published/$RELEASE_FILE"
          cmp "$RUNNER_TEMP/build-evidence/rustdex-qualification-fork-b/$RELEASE_FILE" "$RUNNER_TEMP/release-evidence/published/$RELEASE_FILE"
          gh release verify "$RELEASE_TAG" --repo dream2333/pi --format json > "$RUNNER_TEMP/release-evidence/release-verification.json"
          gh release verify-asset "$RELEASE_TAG" \
            "$RUNNER_TEMP/release-evidence/published/$RELEASE_FILE" \
            --repo dream2333/pi --format json > "$RUNNER_TEMP/release-evidence/asset-verification.json"

      - name: Fetch and bind qualification source
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/.github/workflows/rustdex-coding-agent-qualification.yml?ref=$GITHUB_SHA" \
            > "$RUNNER_TEMP/qualification-workflow.yml"
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/.github/qualification/no-interceptor-trace.test.ts?ref=$GITHUB_SHA" \
            > "$RUNNER_TEMP/no-interceptor-trace.test.ts"
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/.github/qualification/response-model-observation-consumer.test.mjs?ref=$GITHUB_SHA" \
            > "$RUNNER_TEMP/response-model-observation-consumer.test.mjs"
          echo "$TRACE_TEST_SHA256  $RUNNER_TEMP/no-interceptor-trace.test.ts" | sha256sum --check --strict
          echo "$RESPONSE_MODEL_TEST_SHA256  $RUNNER_TEMP/response-model-observation-consumer.test.mjs" | sha256sum --check --strict

      - name: Run published response-model consumer
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/release-evidence/published/$RELEASE_FILE"
          consumer_root="$(mktemp -d "$RUNNER_TEMP/rustdex-published-consumer-XXXXXX")"
          cp "$RUNNER_TEMP/response-model-observation-consumer.test.mjs" "$consumer_root/response-model-observation-consumer.test.mjs"
          cd "$consumer_root"
          npm install --ignore-scripts --package-lock=false --no-audit --no-fund "$tarball" \
            2>&1 | tee "$RUNNER_TEMP/release-evidence/published-response-model-consumer-install.log"
          node --test response-model-observation-consumer.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/release-evidence/published-response-model-consumer.log"

      - name: Write qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(command -v npm)" = "$RUSTDEX_NPM_BIN/npm"
          test "$(node --version)" = "$RUSTDEX_NODE_VERSION_OUTPUT"
          test "$(npm --version)" = "$RUSTDEX_NPM_VERSION"
          test -f "$RUSTDEX_NPM_CLI"
          echo "$RUSTDEX_NPM_CLI_SHA256  $RUSTDEX_NPM_CLI" | sha256sum --check --strict
          test "$(node "$npm_execpath" --version)" = "$RUSTDEX_NPM_VERSION"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" > "$RUNNER_TEMP/run-artifacts.json"
          export BUILD_EVIDENCE_ROOT="$RUNNER_TEMP/build-evidence"
          export RELEASE_EVIDENCE_ROOT="$RUNNER_TEMP/release-evidence"
          export WORKFLOW_SHA256="$(sha256sum "$RUNNER_TEMP/qualification-workflow.yml" | cut -d' ' -f1)"
          export RUN_ARTIFACTS_PATH="$RUNNER_TEMP/run-artifacts.json"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const sha256 = (value) => createHash("sha256").update(value).digest("hex");
          const readJson = (path) => JSON.parse(readFileSync(path, "utf8"));
          if (
            process.env.GITHUB_REF !== "refs/heads/main"
            || process.env.RUSTDEX_MAIN_HEAD_AT_ATTEST_START !== process.env.GITHUB_SHA
          ) throw new Error("qualification workflow main-head identity drift");
          const build = (variant) => readJson(join(process.env.BUILD_EVIDENCE_ROOT, `rustdex-qualification-${variant}`, "build-evidence.json"));
          const forkA = build("fork-a");
          const forkB = build("fork-b");
          const upstream = build("upstream");
          const expectedNpmInstaller = {
            packageName: "npm",
            version: process.env.RUSTDEX_NPM_VERSION,
            tarballUrl: process.env.RUSTDEX_NPM_TARBALL_URL,
            integrity: process.env.RUSTDEX_NPM_TARBALL_INTEGRITY,
            sha512: process.env.RUSTDEX_NPM_TARBALL_SHA512,
            bytes: Number(process.env.RUSTDEX_NPM_TARBALL_BYTES),
            cliSha256: process.env.RUSTDEX_NPM_CLI_SHA256,
          };
          for (const [variant, value, commit] of [
            ["fork-a", forkA, process.env.FORK_COMMIT],
            ["fork-b", forkB, process.env.FORK_COMMIT],
            ["upstream", upstream, process.env.UPSTREAM_BASE_COMMIT],
          ]) {
            if (value.schema !== "rustdex.pi-fork-build-evidence.v2" || value.variant !== variant || value.sourceCommit !== commit || value.result !== "PASS") {
              throw new Error(`invalid build evidence: ${variant}`);
            }
            if (
              value.patchSha256 !== process.env.THIN_FORK_PATCH_SHA256
              || value.workflowSourceCommit !== process.env.GITHUB_SHA
              || value.workflowRef !== "refs/heads/main"
              || value.remoteMainAtStart !== process.env.GITHUB_SHA
              || value.nodeVersion !== process.env.RUSTDEX_NODE_VERSION_OUTPUT
              || value.npmVersion !== process.env.RUSTDEX_NPM_VERSION
              || JSON.stringify(value.npmInstaller) !== JSON.stringify(expectedNpmInstaller)
              || value.runnerOs !== "Windows"
              || value.runnerArch !== "X64"
              || value.runnerEnvironment !== "github-hosted"
            ) {
              throw new Error(`build identity drift: ${variant}`);
            }
          }
          if (
            forkA.releaseSha256 !== process.env.RELEASE_SHA256
            || forkB.releaseSha256 !== process.env.RELEASE_SHA256
            || forkA.noInterceptorTraceSha256 !== forkB.noInterceptorTraceSha256
            || forkA.noInterceptorTraceSha256 !== upstream.noInterceptorTraceSha256
            || forkA.responseModelConsumerSourceSha256 !== process.env.RESPONSE_MODEL_TEST_SHA256
            || forkB.responseModelConsumerSourceSha256 !== process.env.RESPONSE_MODEL_TEST_SHA256
            || !forkA.responseModelConsumerInstallLogSha256
            || !forkB.responseModelConsumerInstallLogSha256
            || !forkA.responseModelConsumerLogSha256
            || !forkB.responseModelConsumerLogSha256
          ) throw new Error("clean build or upstream trace mismatch");
          const packageA = readJson(join(process.env.BUILD_EVIDENCE_ROOT, "rustdex-qualification-fork-a", "package-identity.json"));
          const packageB = readJson(join(process.env.BUILD_EVIDENCE_ROOT, "rustdex-qualification-fork-b", "package-identity.json"));
          if (JSON.stringify(packageA) !== JSON.stringify(packageB)) throw new Error("package identity mismatch");
          if (
            packageA.schema !== "rustdex.pi-package-identity.v2"
            || packageA.packageName !== process.env.PACKAGE_NAME
            || packageA.packageVersion !== process.env.PACKAGE_VERSION
            || packageA.archiveName !== process.env.RELEASE_FILE
            || packageA.archiveBytes !== Number(process.env.RELEASE_BYTES)
            || packageA.archiveSha256 !== process.env.RELEASE_SHA256
            || packageA.archiveSha512 !== process.env.RELEASE_SHA512
            || packageA.packageJsonSha256 !== process.env.PACKAGE_JSON_SHA256
            || packageA.shrinkwrapSha256 !== process.env.PACKAGE_SHRINKWRAP_SHA256
            || packageA.licenseSha256 !== process.env.LICENSE_SHA256
            || packageA.packageContentsSha256 !== process.env.PACKAGE_CONTENTS_SHA256
            || packageA.packageEntryCount !== Number(process.env.PACKAGE_ENTRY_COUNT)
            || packageA.dispatchGuardAbi !== "model-dispatch-interceptor.v1"
            || packageA.responseModelObservationAbi !== "openai-completions-response-model.v1"
            || packageA.releaseConfigSha256 !== process.env.RELEASE_CONFIG_SHA256
          ) throw new Error("response-model package identity mismatch");
          const release = readJson(join(process.env.RELEASE_EVIDENCE_ROOT, "release.json"));
          const tagRef = readJson(join(process.env.RELEASE_EVIDENCE_ROOT, "tag-ref.json"));
          const tagObject = readJson(join(process.env.RELEASE_EVIDENCE_ROOT, "tag-object.json"));
          const runArtifacts = readJson(process.env.RUN_ARTIFACTS_PATH).artifacts
            .filter((entry) => entry.name.startsWith("rustdex-qualification-"))
            .sort((left, right) => left.name.localeCompare(right.name))
            .map((entry) => ({ id: entry.id, name: entry.name, sizeInBytes: entry.size_in_bytes, digest: entry.digest, expired: entry.expired }));
          if (runArtifacts.length !== 3 || runArtifacts.some((entry) => entry.expired)) throw new Error("build artifact set is incomplete");
          const releaseAsset = release.assets.find((entry) => entry.name === process.env.RELEASE_FILE);
          const receipt = {
            schema: "rustdex.pi-fork-qualification-receipt.v2",
            workflow: {
              repository: process.env.GITHUB_REPOSITORY,
              path: ".github/workflows/rustdex-coding-agent-qualification.yml",
              sourceCommit: process.env.GITHUB_SHA,
              ref: process.env.GITHUB_REF,
              mainHeadAtAttestStart: process.env.RUSTDEX_MAIN_HEAD_AT_ATTEST_START,
              sha256: process.env.WORKFLOW_SHA256,
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            },
            source: {
              repository: "https://github.com/dream2333/pi",
              upstreamBaseCommit: process.env.UPSTREAM_BASE_COMMIT,
              forkCommit: process.env.FORK_COMMIT,
              mergeBase: process.env.UPSTREAM_BASE_COMMIT,
              thinForkPatchSha256: process.env.THIN_FORK_PATCH_SHA256,
              thinForkPatchBytes: Number(process.env.THIN_FORK_PATCH_BYTES),
              changedPaths: [
                "packages/ai/src/api/openai-completions.ts",
                "packages/ai/src/types.ts",
                "packages/ai/test/openai-completions-response-model.test.ts",
                "packages/coding-agent/src/core/sdk.ts",
                "packages/coding-agent/src/index.ts",
                "packages/coding-agent/test/sdk-model-dispatch-interceptor.test.ts",
                "scripts/build-rustdex-coding-agent-release.mjs",
                "scripts/rustdex-coding-agent-release.json",
                "scripts/rustdex-coding-agent-release.test.mjs",
              ],
            },
            build: {
              isolatedRunners: 2,
              nodeVersion: forkA.nodeVersion,
              npmVersion: forkA.npmVersion,
              npmInstaller: expectedNpmInstaller,
              upstreamModelArchiveSha256: process.env.UPSTREAM_MODEL_ARCHIVE_SHA256,
              forkA,
              forkB,
              upstreamTrace: upstream,
              noInterceptorTraceSha256: forkA.noInterceptorTraceSha256,
              traceTestSha256: process.env.TRACE_TEST_SHA256,
              responseModelConsumerTestSha256: process.env.RESPONSE_MODEL_TEST_SHA256,
              responseModelConsumerInstallLogSha256: {
                forkA: forkA.responseModelConsumerInstallLogSha256,
                forkB: forkB.responseModelConsumerInstallLogSha256,
              },
              responseModelConsumerLogSha256: {
                forkA: forkA.responseModelConsumerLogSha256,
                forkB: forkB.responseModelConsumerLogSha256,
              },
              artifacts: runArtifacts,
            },
            release: {
              id: release.id,
              immutable: release.immutable,
              url: release.html_url,
              tag: release.tag_name,
              tagObjectSha: tagRef.object.sha,
              peeledCommit: tagObject.object.sha,
              assetId: releaseAsset.id,
              assetName: releaseAsset.name,
              assetBytes: releaseAsset.size,
              assetDigest: releaseAsset.digest,
              sha512: process.env.RELEASE_SHA512,
              publishedResponseModelConsumerInstallLogSha256: sha256(readFileSync(join(process.env.RELEASE_EVIDENCE_ROOT, "published-response-model-consumer-install.log"))),
              publishedResponseModelConsumerLogSha256: sha256(readFileSync(join(process.env.RELEASE_EVIDENCE_ROOT, "published-response-model-consumer.log"))),
              releaseVerificationSha256: sha256(readFileSync(join(process.env.RELEASE_EVIDENCE_ROOT, "release-verification.json"))),
              assetVerificationSha256: sha256(readFileSync(join(process.env.RELEASE_EVIDENCE_ROOT, "asset-verification.json"))),
            },
            package: packageA,
            consumerDependencyClosure: {
              sha256: process.env.CONSUMER_DEPENDENCY_CLOSURE_SHA256,
              authority: "rustdex.pi-runtime-lock",
            },
            conformance: {
              noInterceptorUpstreamTrace: "byte-identical",
              dispatchGuard: "PASS",
              sameModelRetry: "PASS",
              autoCompactionQueue: "PASS",
              concurrentSession: "PASS",
              agentSettlement: "PASS",
              compactionCancel: "PASS",
              releaseBuilder: "PASS",
              responseModelObservation: "PASS",
              cleanBuildContentIdentity: "PASS",
              immutableReleaseContentIdentity: "PASS",
            },
            result: "PASS",
          };
          writeFileSync(join(process.env.RUNNER_TEMP, "qualification-receipt.json"), `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

      - name: Attest rebuilt release
        id: attest-release
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ runner.temp }}/build-evidence/rustdex-qualification-fork-a/${{ env.RELEASE_FILE }}

      - name: Attest qualification receipt
        id: attest-receipt
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ runner.temp }}/qualification-receipt.json

      - name: Verify new attestations against exact signer
        shell: bash
        run: |
          set -euo pipefail
          signer="dream2333/pi/.github/workflows/rustdex-coding-agent-qualification.yml"
          common=(--repo dream2333/pi --signer-workflow "$signer" --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
          gh attestation verify "$RUNNER_TEMP/qualification-receipt.json" "${common[@]}" > "$RUNNER_TEMP/receipt-attestation-verification.json"
          gh attestation verify "$RUNNER_TEMP/build-evidence/rustdex-qualification-fork-a/$RELEASE_FILE" "${common[@]}" > "$RUNNER_TEMP/rebuild-attestation-verification.json"

      - name: Upload qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rustdex-coding-agent-v0.84.3.4-qualification
          path: |
            ${{ runner.temp }}/qualification-receipt.json
            ${{ runner.temp }}/qualification-workflow.yml
            ${{ runner.temp }}/no-interceptor-trace.test.ts
            ${{ runner.temp }}/response-model-observation-consumer.test.mjs
            ${{ runner.temp }}/receipt-attestation-verification.json
            ${{ runner.temp }}/rebuild-attestation-verification.json
            ${{ steps.attest-release.outputs.bundle-path }}
            ${{ steps.attest-receipt.outputs.bundle-path }}
            ${{ runner.temp }}/release-evidence
            ${{ runner.temp }}/build-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
