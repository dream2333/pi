      - name: Attest rebuilt release
        id: attest-release
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ runner.temp }}/build-evidence/rustdex-qualification-fork-a/${{ env.RELEASE_FILE }}

      - name: Attest qualification receipt
        id: attest-receipt
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ runner.temp }}/qualification-receipt.json

      - name: Verify new attestations against exact signer
        shell: bash
        run: |
          set -euo pipefail
          signer="dream2333/pi/.github/workflows/rustdex-coding-agent-qualification.yml"
          common=(--repo dream2333/pi --signer-workflow "$signer" --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" --source-ref refs/heads/main --deny-self-hosted-runners --format json)
          gh attestation verify "$RUNNER_TEMP/qualification-receipt.json" "${common[@]}" > "$RUNNER_TEMP/receipt-attestation-verification.json"
          gh attestation verify "$RUNNER_TEMP/build-evidence/rustdex-qualification-fork-a/$RELEASE_FILE" "${common[@]}" > "$RUNNER_TEMP/rebuild-attestation-verification.json"

