name: Rustdex coding-agent qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustdex-coding-agent-v0.84.3.3-qualification-v2
  cancel-in-progress: false

env:
  FORK_REPOSITORY: https://github.com/dream2333/pi.git
  FORK_COMMIT: 5f3747430255eff74d9d82dd60d2270fbf45db54
  UPSTREAM_BASE_COMMIT: 4e494929998d6bc4fccf75e0a233f727db4b70ee
  THIN_FORK_PATCH_SHA256: e07651e8e41b2416dd6266953f8d3b8e3e1f8b16f985605e56aada598c8a0325
  THIN_FORK_PATCH_BYTES: "33292"
  TRACE_TEST_SHA256: 2de7ade62736964a6239380a3f606ea3285062694e9fb0f14eab41f01a61a094
  RELEASE_TAG: rustdex-coding-agent-v0.84.3.3
  RELEASE_FILE: dream2333-pi-coding-agent-0.84.3-rustdex.3.tgz
  RELEASE_SHA256: 28ad878330d48c283699a165a084da192784fbbf5829d04b517df8132ae36785
  RELEASE_SHA512: d675b0802e190e1b0b67697b7269d32fcd823afb4c9271c4ade861f829887e6635a148f6b3eb2b714fb87e3ed362b4dc41747603e9f5c3bb057dfb3d29b764b7
  RELEASE_BYTES: "6892175"
  PACKAGE_NAME: "@dream2333/pi-coding-agent"
  PACKAGE_VERSION: 0.84.3-rustdex.3
  PACKAGE_JSON_SHA256: 8aace9c4494cd3bc5b8764677aeababa6813c87c376e09c20021cf5550517e97
  PACKAGE_SHRINKWRAP_SHA256: d8054ed8e02ce504a73c3a31d7421b9488a43020f2415f357ad83695e72c6512
  PACKAGE_CONTENTS_SHA256: 86d4ebc75f99c49587a42f4424c3fa440af1c136e679557b151977547f27a2b7
  PACKAGE_ENTRY_COUNT: "1045"
  LICENSE_SHA256: 0457f5bcec3b3b211605dfb5d1a49042fd638f3686a410fe099c24a25af13c48
  CONSUMER_DEPENDENCY_CLOSURE_SHA256: f67a8f514ee966a69c613738a8e614778084c1c70317e83ff9845087759e7ccd
  UPSTREAM_MODEL_ARCHIVE_URL: https://github.com/earendil-works/pi/releases/download/v0.84.3/pi-0.84.3-source.tar.gz
  UPSTREAM_MODEL_ARCHIVE_SHA256: 056f84c467450fb5700ad4df9c8cc669bf7f6046976eed7a19eadbc7553b6500

jobs:
  build:
    name: build-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: fork-a
            sourceCommit: 5f3747430255eff74d9d82dd60d2270fbf45db54
            buildRelease: "true"
            runForkTests: "true"
          - variant: fork-b
            sourceCommit: 5f3747430255eff74d9d82dd60d2270fbf45db54
            buildRelease: "true"
            runForkTests: "false"
          - variant: upstream
            sourceCommit: 4e494929998d6bc4fccf75e0a233f727db4b70ee
            buildRelease: "false"
            runForkTests: "false"
    env:
      BUILD_VARIANT: ${{ matrix.variant }}
      SOURCE_COMMIT: ${{ matrix.sourceCommit }}
      BUILD_RELEASE: ${{ matrix.buildRelease }}
      RUN_FORK_TESTS: ${{ matrix.runForkTests }}

    steps:
      - name: Fetch exact source and ancestry
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$FORK_REPOSITORY"
          git fetch --no-tags --depth=32 origin "$FORK_COMMIT"
          git merge-base --is-ancestor "$UPSTREAM_BASE_COMMIT" "$FORK_COMMIT"
          test "$(git merge-base "$UPSTREAM_BASE_COMMIT" "$FORK_COMMIT")" = "$UPSTREAM_BASE_COMMIT"
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.8.0

      - name: Verify the complete thin-fork patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$UPSTREAM_BASE_COMMIT" "$FORK_COMMIT" > "$RUNNER_TEMP/fork-files.txt"
          cat > "$RUNNER_TEMP/expected-fork-files.txt" <<'EOF'
          packages/coding-agent/src/core/sdk.ts
          packages/coding-agent/src/index.ts
          packages/coding-agent/test/sdk-model-dispatch-interceptor.test.ts
          scripts/build-rustdex-coding-agent-release.mjs
          scripts/rustdex-coding-agent-release.json
          scripts/rustdex-coding-agent-release.test.mjs
          EOF
          diff -u "$RUNNER_TEMP/expected-fork-files.txt" "$RUNNER_TEMP/fork-files.txt"
          git diff --binary --full-index "$UPSTREAM_BASE_COMMIT" "$FORK_COMMIT" -- \
            packages/coding-agent/src/core/sdk.ts \
            packages/coding-agent/src/index.ts \
            packages/coding-agent/test/sdk-model-dispatch-interceptor.test.ts \
            scripts/build-rustdex-coding-agent-release.mjs \
            scripts/rustdex-coding-agent-release.json \
            scripts/rustdex-coding-agent-release.test.mjs \
            > "$RUNNER_TEMP/thin-fork.patch"
          echo "$THIN_FORK_PATCH_SHA256  $RUNNER_TEMP/thin-fork.patch" | sha256sum --check --strict
          test "$(wc -c < "$RUNNER_TEMP/thin-fork.patch")" = "$THIN_FORK_PATCH_BYTES"

      - name: Install exact monorepo dependencies
        shell: bash
        run: npm ci

      - name: Acquire and inspect pinned upstream model data
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/pi-model-data.tar.gz" "$UPSTREAM_MODEL_ARCHIVE_URL"
          echo "$UPSTREAM_MODEL_ARCHIVE_SHA256  $RUNNER_TEMP/pi-model-data.tar.gz" | sha256sum --check --strict
          tar -tzf "$RUNNER_TEMP/pi-model-data.tar.gz" > "$RUNNER_TEMP/model-archive-members.txt"
          if grep -E '(^/|(^|/)\.\.(/|$))' "$RUNNER_TEMP/model-archive-members.txt"; then
            echo "unsafe model archive member" >&2
            exit 1
          fi
          if tar -tvzf "$RUNNER_TEMP/pi-model-data.tar.gz" | awk '{ type=substr($1,1,1); if (type != "-" && type != "d") exit 1 }'; then
            :
          else
            echo "model archive contains links or special entries" >&2
            exit 1
          fi
          if grep -Ev '^pi-0\.84\.3(/|$)' "$RUNNER_TEMP/model-archive-members.txt"; then
            echo "model archive root differs from the pinned release" >&2
            exit 1
          fi

      - name: Build exact source in an isolated runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BUILD_RELEASE" == "true" ]]; then
            mkdir -p "$RUNNER_TEMP/release"
            node scripts/build-rustdex-coding-agent-release.mjs \
              --output "$RUNNER_TEMP/release" \
              --model-data-archive "$RUNNER_TEMP/pi-model-data.tar.gz" \
              > "$RUNNER_TEMP/build.log" 2>&1
          else
            tar -xzf "$RUNNER_TEMP/pi-model-data.tar.gz" --strip-components=1 -C "$GITHUB_WORKSPACE"
            npm run build:offline > "$RUNNER_TEMP/build.log" 2>&1
          fi

      - name: Run upstream/fork no-interceptor trace
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA":.github/qualification/no-interceptor-trace.test.ts \
            > packages/coding-agent/test/rustdex-qualification-trace.test.ts
          echo "$TRACE_TEST_SHA256  packages/coding-agent/test/rustdex-qualification-trace.test.ts" | sha256sum --check --strict
          RUSTDEX_TRACE_OUTPUT="$RUNNER_TEMP/no-interceptor-trace.json" \
            npx vitest --run packages/coding-agent/test/rustdex-qualification-trace.test.ts \
            2>&1 | tee "$RUNNER_TEMP/trace-test.log"

      - name: Run dispatch and unchanged-state-machine conformance tests
        if: matrix.runForkTests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx vitest --run \
            packages/coding-agent/test/sdk-model-dispatch-interceptor.test.ts \
            packages/coding-agent/test/agent-session-retry.test.ts \
            packages/coding-agent/test/agent-session-auto-compaction-queue.test.ts \
            packages/coding-agent/test/agent-session-concurrent.test.ts \
            packages/coding-agent/test/suite/regressions/1717-2113-agent-session-event-settlement.test.ts \
            packages/coding-agent/test/suite/regressions/3688-tree-cancel-compacting.test.ts \
            2>&1 | tee "$RUNNER_TEMP/fork-tests.log"
          node --test scripts/rustdex-coding-agent-release.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/release-tests.log"

      - name: Verify release package identity
        if: matrix.buildRelease == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/release/$RELEASE_FILE"
          mkdir -p "$RUNNER_TEMP/package"
          tar -tzf "$tarball" > "$RUNNER_TEMP/package-members.txt"
          if grep -E '(^/|(^|/)\.\.(/|$))' "$RUNNER_TEMP/package-members.txt"; then exit 1; fi
          if ! tar -tvzf "$tarball" | awk '{ type=substr($1,1,1); if (type != "-" && type != "d") exit 1 }'; then exit 1; fi
          if grep -Ev '^package(/|$)' "$RUNNER_TEMP/package-members.txt"; then exit 1; fi
          tar -xzf "$tarball" -C "$RUNNER_TEMP/package"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readdirSync, readFileSync, statSync, writeFileSync } from "node:fs";
          import { join, relative } from "node:path";
          const sha256 = (value) => createHash("sha256").update(value).digest("hex");
          const root = join(process.env.RUNNER_TEMP, "package", "package");
          const packageBytes = readFileSync(join(root, "package.json"));
          const packageJson = JSON.parse(packageBytes);
          const required = {
            name: process.env.PACKAGE_NAME,
            version: process.env.PACKAGE_VERSION,
            main: "./dist/bundle/index.js",
            types: "./dist/index.d.ts",
          };
          for (const [key, expected] of Object.entries(required)) {
            if (packageJson[key] !== expected) throw new Error(`package ${key} drift`);
          }
          if (
            packageJson.exports?.["."]?.import !== "./dist/bundle/index.js"
            || packageJson.exports?.["."]?.types !== "./dist/index.d.ts"
            || packageJson.rustdexFork?.upstreamCommit !== process.env.UPSTREAM_BASE_COMMIT
            || packageJson.rustdexFork?.forkCommit !== process.env.FORK_COMMIT
            || packageJson.rustdexFork?.dispatchGuardAbi !== "model-dispatch-interceptor.v1"
          ) throw new Error("package SDK/fork identity drift");
          for (const name of ["preinstall", "install", "postinstall"]) {
            if (Object.hasOwn(packageJson.scripts ?? {}, name)) throw new Error(`forbidden lifecycle script: ${name}`);
          }
          const shrinkwrapHash = sha256(readFileSync(join(root, "npm-shrinkwrap.json")));
          const licenseHash = sha256(readFileSync(join(root, "LICENSE")));
          if (sha256(packageBytes) !== process.env.PACKAGE_JSON_SHA256) throw new Error("package.json drift");
          if (shrinkwrapHash !== process.env.PACKAGE_SHRINKWRAP_SHA256) throw new Error("shrinkwrap drift");
          if (licenseHash !== process.env.LICENSE_SHA256) throw new Error("license drift");
          const files = [];
          const visit = (directory) => {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              if (entry.isDirectory()) visit(path);
              else if (entry.isFile()) files.push(path);
              else throw new Error("unsupported package filesystem entry");
            }
          };
          visit(root);
          const records = files.map((path) => {
            const bytes = readFileSync(path);
            return `${relative(root, path).replaceAll("\\\\", "/")}\0${statSync(path).size}\0${sha256(bytes)}\n`;
          }).sort();
          const contentsHash = sha256(records.join(""));
          if (contentsHash !== process.env.PACKAGE_CONTENTS_SHA256) throw new Error("package contents drift");
          if (files.length !== Number(process.env.PACKAGE_ENTRY_COUNT)) throw new Error("package entry count drift");
          writeFileSync(join(process.env.RUNNER_TEMP, "package-identity.json"), `${JSON.stringify({
            schema: "rustdex.pi-package-identity.v1",
            packageName: packageJson.name,
            packageVersion: packageJson.version,
            packageJsonSha256: sha256(packageBytes),
            shrinkwrapSha256: shrinkwrapHash,
            licenseSha256: licenseHash,
            packageContentsSha256: contentsHash,
            packageEntryCount: files.length,
            forbiddenLifecycleScripts: "absent",
          }, null, 2)}\n`);
          NODE

      - name: Assemble build evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/evidence"
          mkdir -p "$evidence"
          cp "$RUNNER_TEMP/thin-fork.patch" "$evidence/thin-fork.patch"
          cp "$RUNNER_TEMP/no-interceptor-trace.json" "$evidence/no-interceptor-trace.json"
          cp "$RUNNER_TEMP/build.log" "$evidence/build.log"
          cp "$RUNNER_TEMP/trace-test.log" "$evidence/trace-test.log"
          if [[ -f "$RUNNER_TEMP/fork-tests.log" ]]; then cp "$RUNNER_TEMP/fork-tests.log" "$evidence/fork-tests.log"; fi
          if [[ -f "$RUNNER_TEMP/release-tests.log" ]]; then cp "$RUNNER_TEMP/release-tests.log" "$evidence/release-tests.log"; fi
          if [[ "$BUILD_RELEASE" == "true" ]]; then
            cp "$RUNNER_TEMP/release/$RELEASE_FILE" "$evidence/$RELEASE_FILE"
            cp "$RUNNER_TEMP/package-identity.json" "$evidence/package-identity.json"
          fi
          export EVIDENCE_ROOT="$evidence"
          export NODE_VERSION="$(node --version)"
          export NPM_VERSION="$(npm --version)"
          export PACKAGE_LOCK_SHA256="$(sha256sum package-lock.json | cut -d' ' -f1)"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { existsSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const hash = (name) => {
            const path = join(process.env.EVIDENCE_ROOT, name);
            return existsSync(path) ? createHash("sha256").update(readFileSync(path)).digest("hex") : null;
          };
          const metadata = {
            schema: "rustdex.pi-fork-build-evidence.v1",
            variant: process.env.BUILD_VARIANT,
            sourceCommit: process.env.SOURCE_COMMIT,
            upstreamBaseCommit: process.env.UPSTREAM_BASE_COMMIT,
            forkCommit: process.env.FORK_COMMIT,
            runnerImage: `${process.env.ImageOS ?? "unknown"}-${process.env.ImageVersion ?? "unknown"}`,
            nodeVersion: process.env.NODE_VERSION,
            npmVersion: process.env.NPM_VERSION,
            packageLockSha256: process.env.PACKAGE_LOCK_SHA256,
            patchSha256: hash("thin-fork.patch"),
            noInterceptorTraceSha256: hash("no-interceptor-trace.json"),
            buildLogSha256: hash("build.log"),
            traceTestLogSha256: hash("trace-test.log"),
            forkTestsLogSha256: hash("fork-tests.log"),
            releaseTestsLogSha256: hash("release-tests.log"),
            releaseSha256: hash(process.env.RELEASE_FILE),
            packageIdentitySha256: hash("package-identity.json"),
            result: "PASS",
          };
          writeFileSync(join(process.env.EVIDENCE_ROOT, "build-evidence.json"), `${JSON.stringify(metadata, null, 2)}\n`);
          NODE

      - name: Upload isolated build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rustdex-qualification-${{ matrix.variant }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
  attest:
    name: compare-and-attest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download isolated build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: rustdex-qualification-*
          path: ${{ runner.temp }}/build-evidence

      - name: Compare clean builds and upstream trace
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/build-evidence"
          cmp "$root/rustdex-qualification-fork-a/$RELEASE_FILE" "$root/rustdex-qualification-fork-b/$RELEASE_FILE"
          cmp "$root/rustdex-qualification-fork-a/no-interceptor-trace.json" "$root/rustdex-qualification-fork-b/no-interceptor-trace.json"
          cmp "$root/rustdex-qualification-fork-a/no-interceptor-trace.json" "$root/rustdex-qualification-upstream/no-interceptor-trace.json"
          cmp "$root/rustdex-qualification-fork-a/thin-fork.patch" "$root/rustdex-qualification-fork-b/thin-fork.patch"
          cmp "$root/rustdex-qualification-fork-a/thin-fork.patch" "$root/rustdex-qualification-upstream/thin-fork.patch"
          cmp "$root/rustdex-qualification-fork-a/package-identity.json" "$root/rustdex-qualification-fork-b/package-identity.json"
          echo "$THIN_FORK_PATCH_SHA256  $root/rustdex-qualification-fork-a/thin-fork.patch" | sha256sum --check --strict

      - name: Verify immutable release and tag identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-evidence"
          gh api "repos/dream2333/pi/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-evidence/release.json"
          gh api "repos/dream2333/pi/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-evidence/tag-ref.json"
          tag_object="$(jq -r '.object.sha' "$RUNNER_TEMP/release-evidence/tag-ref.json")"
          test "$(jq -r '.object.type' "$RUNNER_TEMP/release-evidence/tag-ref.json")" = "tag"
          gh api "repos/dream2333/pi/git/tags/$tag_object" > "$RUNNER_TEMP/release-evidence/tag-object.json"
          test "$(jq -r '.object.type' "$RUNNER_TEMP/release-evidence/tag-object.json")" = "commit"
          test "$(jq -r '.object.sha' "$RUNNER_TEMP/release-evidence/tag-object.json")" = "$FORK_COMMIT"
          test "$(jq -r '.immutable' "$RUNNER_TEMP/release-evidence/release.json")" = "true"
          test "$(jq -r '.id' "$RUNNER_TEMP/release-evidence/release.json")" = "378723179"
          asset="$(jq -c --arg name "$RELEASE_FILE" '.assets[] | select(.name == $name)' "$RUNNER_TEMP/release-evidence/release.json")"
          test "$(jq -r '.id' <<<"$asset")" = "534265788"
          test "$(jq -r '.size' <<<"$asset")" = "$RELEASE_BYTES"
          test "$(jq -r '.digest' <<<"$asset")" = "sha256:$RELEASE_SHA256"
          mkdir -p "$RUNNER_TEMP/release-evidence/published"
          gh release download "$RELEASE_TAG" --repo dream2333/pi --pattern "$RELEASE_FILE" --dir "$RUNNER_TEMP/release-evidence/published"
          echo "$RELEASE_SHA256  $RUNNER_TEMP/release-evidence/published/$RELEASE_FILE" | sha256sum --check --strict
          echo "$RELEASE_SHA512  $RUNNER_TEMP/release-evidence/published/$RELEASE_FILE" | sha512sum --check --strict
          gh release verify "$RELEASE_TAG" --repo dream2333/pi --format json > "$RUNNER_TEMP/release-evidence/release-verification.json"
          gh release verify-asset "$RELEASE_TAG" \
            "$RUNNER_TEMP/release-evidence/published/$RELEASE_FILE" \
            --repo dream2333/pi --format json > "$RUNNER_TEMP/release-evidence/asset-verification.json"

      - name: Fetch and bind qualification source
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/.github/workflows/rustdex-coding-agent-qualification.yml?ref=$GITHUB_SHA" \
            > "$RUNNER_TEMP/qualification-workflow.yml"
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/.github/qualification/no-interceptor-trace.test.ts?ref=$GITHUB_SHA" \
            > "$RUNNER_TEMP/no-interceptor-trace.test.ts"
          echo "$TRACE_TEST_SHA256  $RUNNER_TEMP/no-interceptor-trace.test.ts" | sha256sum --check --strict

      - name: Write qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" > "$RUNNER_TEMP/run-artifacts.json"
          export BUILD_EVIDENCE_ROOT="$RUNNER_TEMP/build-evidence"
          export RELEASE_EVIDENCE_ROOT="$RUNNER_TEMP/release-evidence"
          export WORKFLOW_SHA256="$(sha256sum "$RUNNER_TEMP/qualification-workflow.yml" | cut -d' ' -f1)"
          export RUN_ARTIFACTS_PATH="$RUNNER_TEMP/run-artifacts.json"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const sha256 = (value) => createHash("sha256").update(value).digest("hex");
          const readJson = (path) => JSON.parse(readFileSync(path, "utf8"));
          const build = (variant) => readJson(join(process.env.BUILD_EVIDENCE_ROOT, `rustdex-qualification-${variant}`, "build-evidence.json"));
          const forkA = build("fork-a");
          const forkB = build("fork-b");
          const upstream = build("upstream");
          for (const [variant, value, commit] of [
            ["fork-a", forkA, process.env.FORK_COMMIT],
            ["fork-b", forkB, process.env.FORK_COMMIT],
            ["upstream", upstream, process.env.UPSTREAM_BASE_COMMIT],
          ]) {
            if (value.schema !== "rustdex.pi-fork-build-evidence.v1" || value.variant !== variant || value.sourceCommit !== commit || value.result !== "PASS") {
              throw new Error(`invalid build evidence: ${variant}`);
            }
            if (value.patchSha256 !== process.env.THIN_FORK_PATCH_SHA256 || value.nodeVersion !== "v24.8.0") {
              throw new Error(`build identity drift: ${variant}`);
            }
          }
          if (
            forkA.releaseSha256 === null
            || forkB.releaseSha256 === null
            || forkA.noInterceptorTraceSha256 !== forkB.noInterceptorTraceSha256
            || forkA.noInterceptorTraceSha256 !== upstream.noInterceptorTraceSha256
          ) throw new Error("clean build or upstream trace mismatch");
          const packageA = readJson(join(process.env.BUILD_EVIDENCE_ROOT, "rustdex-qualification-fork-a", "package-identity.json"));
          const packageB = readJson(join(process.env.BUILD_EVIDENCE_ROOT, "rustdex-qualification-fork-b", "package-identity.json"));
          if (JSON.stringify(packageA) !== JSON.stringify(packageB)) throw new Error("package identity mismatch");
          const release = readJson(join(process.env.RELEASE_EVIDENCE_ROOT, "release.json"));
          const tagRef = readJson(join(process.env.RELEASE_EVIDENCE_ROOT, "tag-ref.json"));
          const tagObject = readJson(join(process.env.RELEASE_EVIDENCE_ROOT, "tag-object.json"));
          const runArtifacts = readJson(process.env.RUN_ARTIFACTS_PATH).artifacts
            .filter((entry) => entry.name.startsWith("rustdex-qualification-"))
            .sort((left, right) => left.name.localeCompare(right.name))
            .map((entry) => ({ id: entry.id, name: entry.name, sizeInBytes: entry.size_in_bytes, digest: entry.digest, expired: entry.expired }));
          if (runArtifacts.length !== 3 || runArtifacts.some((entry) => entry.expired)) throw new Error("build artifact set is incomplete");
          const releaseAsset = release.assets.find((entry) => entry.name === process.env.RELEASE_FILE);
          const receipt = {
            schema: "rustdex.pi-fork-qualification-receipt.v1",
            workflow: {
              repository: process.env.GITHUB_REPOSITORY,
              path: ".github/workflows/rustdex-coding-agent-qualification.yml",
              sourceCommit: process.env.GITHUB_SHA,
              ref: process.env.GITHUB_REF,
              sha256: process.env.WORKFLOW_SHA256,
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            },
            source: {
              repository: "https://github.com/dream2333/pi",
              upstreamBaseCommit: process.env.UPSTREAM_BASE_COMMIT,
              forkCommit: process.env.FORK_COMMIT,
              mergeBase: process.env.UPSTREAM_BASE_COMMIT,
              thinForkPatchSha256: process.env.THIN_FORK_PATCH_SHA256,
              thinForkPatchBytes: Number(process.env.THIN_FORK_PATCH_BYTES),
              changedPaths: [
